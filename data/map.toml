# map.toml: the map settings of the game server, converted from the original
# map.dat and the mem.dat it includes by patella-convert. The game reads
# map.toml in its data folder ([paths] data of config.toml). An unknown or
# missing key, a value of the wrong type or out of range, or a depot given
# twice, is an error.
#
#   refreshed_cylinders  How many cylinders the game refreshes each minute.
#                        A cylinder is the sectors of one x and y on all
#                        floors; the game goes through them row by row and
#                        loads the fields marked Refresh in them anew from
#                        the original map, but in sectors near a player.
#   newbie_start         The field [x, y, z] new characters start on, their
#                        home; a player without a vocation whose home lies
#                        in a premium area gets it as home again while his
#                        account is not premium. x 1 to 65535.
#   veteran_start        The same for a player with a vocation. x 1 to 65535.
#
# [sectors] is the extent of the map in sectors of 32 by 32 fields (the files
# XXXX-YYYY-ZZ.sec): x_min to x_max and y_min to y_max (1 to 2046), and the
# floors z_min to z_max (0 to 15, 7 is the ground).
#
# [memory] is the room for the objects:
#   objects     How many object numbers the game makes room for at first, a
#               power of 2; it doubles them when few are left.
#   cache_size  How many objects the game keeps in memory, a multiple of
#               32768; when they are all in use, it swaps out the sector used
#               longest ago.
#
# Each [[mark]] is a named field a gamemaster can teleport to:
#   name      Its name, at most 19 characters. A name is looked up in any
#             case, and the first mark of that name counts.
#   position  Its field [x, y, z].
#
# Each [[depot]] is a town's depot:
#   id    Its number, 0 to 8 (a player has one depot of each number), each
#         at most once. The move and use rules (load_depot, save_depot)
#         and the areas of houses.toml name it.
#   town  The town's name, at most 19 characters: letters and parcels sent
#         to the town go into this depot, and the query manager lists the
#         town's houses under it.
#   size  How many objects the depot holds, twice as many for a premium
#         account; below 1 counts as 1 (an error is logged).
#
# Coordinates: x and y 0 to 65535, z 0 to 15.

