# type or out of range is an error, as is an unknown race key.
#
# homes is an array of one inline table per home:
#   race            The race's key (monsters.toml).
#   position        [x, y, z], the middle of the home.
#   radius          How far from position its monsters appear and walk, in
#                   fields along x and y.
#   amount          The most monsters it has.
