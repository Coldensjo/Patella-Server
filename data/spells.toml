# spells.toml: the spells of the game server, which players and gamemasters
# cast by saying their words, written by patella-convert from the spell table
# the game had in its code. The game reads spells.toml in its data folder
# ([paths] data of config.toml). This file says what a spell is called, how it
# is cast, what it needs and costs, and which script does what it does: a Lua
# file in the scripts folder (data/scripts/ in the repository). An unknown key
# or flag, or a value of the wrong type, is an error.
#
# Each [[spell]] is one spell:
#   number       The spell number, 1 to 255, each at most once and none of a
#                command in commands.toml. The player files keep the numbers
#                of the spells a player knows, so a spell keeps its number. It
#                does not say what the spell does; script does.
#   name         The name the spellbook shows, at most 30 characters.
#   words        What is said to cast it, as the spellbook shows it: the
#                class syllable and the next one as one word, every further
#                syllable a word of its own, separated by single spaces; at
#                most 10 syllables, and no two spells (or commands in
#                commands.toml) with the same. The class says how the spell
#                is cast: "ex" and "ut" at once, "ad" makes a rune of a
#                blank rune in a hand; the classes "al" and "om" are the
#                commands, in commands.toml. "para" stands for a word the
#                caster chooses (a name, a number; in quotes if it has
#                spaces).
#   level        The character level needed to cast it, or for a rune to
#                make it. Left out, 0.
#   mana         The mana it costs. Left out, 0.
#   soul_points  The soul points it costs. Left out, 0.
#   flags        By these names; left out, none:
#                aggressive      An attack: not in a protection zone (a rune
#                                neither at one) without the right to attack
#                                everywhere; it keeps the caster from
#                                logging out for 60 seconds; a rune aims at
#                                another creature on the field.
#                premium         For premium accounts only.
#                factor_max_100  The damage or healing factor (2 * level +
#                                3 * magic level, in percent) is at most 100.
#                factor_min_100  That factor is at least 100.
#   rune         The rune a rune spell ("ad") makes: group and number, the
#                object's old numbering (conversion.toml gives the type),
#                group 1 to 255 and number 0 to 255; magic_level, the magic
#                level needed to use the rune (its description says it); and
#                charges, the charges the rune is made with. magic_level and
#                charges left out are 0. Left out, the spell makes no rune.
#   script       The script that does what the spell does, its path in the
#                scripts folder: "spells/<name>.lua" for a spell cast at once
#                ("ex", "ut"), "runes/<name>.lua" for a rune spell ("ad"). Its
#                global function onCastSpell runs when the spell is cast or
#                its rune is used (making the rune is the game's). Left out,
#                casting the spell does nothing beyond its checks, and its
#                rune cannot be used.
#
# The syllables:
#   al, ad, ex, ut, om, para, ana, evo, ori, mort, lux, liber, vita, flam, pox,
#   hur, moe, ani, ina, eta, amo, hora, gran, cogni, res, mas, vis, som, aqua,
#   frigo, tera, ura, sio, grav, ito, pan, vid, isa, iva, con

