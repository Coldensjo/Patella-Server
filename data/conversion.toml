# conversion.toml: the old numbers of the object types of the game server,
# converted from the original conversion.lst by patella-convert. The game
# reads conversion.toml in its data folder ([paths] data of config.toml). An
# unknown key, a group or number that is not 0 to 255 written without leading
# zeros, or a type that is not 1 to 8191, is an error.
#
# Before each object type had a number of its own (the id in items.toml), a
# type was known by a group and a number within it. The game still names some
# types that way: its code those of the food, arrows and bolts the spells
# make, the enchanted staff and the amulet of loss, and spells.toml the runes
# the rune spells make. This table gives their types.
#
# Each table [group.G] holds the old numbers N of group G as N = type, the
# id of the type in items.toml. A number that is not given has no type (the
# game logs an error when it asks for one). The game sets 0/0 to 0/10 (no
# type and the body containers, which keep their numbers) and 250/0 (the
# creature, type 99) itself; they may not be given.

[group.1]
0 = 100
1 = 101

