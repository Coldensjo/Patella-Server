# raids.toml: the raids of the game server, converted from the original
# mon/*.evt files by patella-convert, with their comments. The game reads
# raids.toml in its data folder ([paths] data of config.toml) at start. A raid
# is named by its key, the name of its original file without ".evt"; the
# start_monsterraid command names it. The raids are in the order in which the
# original game read its files on the reference installation (readdir of
# mon/), which is the order in which their start rounds are drawn. An unknown
# key, a missing one, a value of the wrong type or out of range is an error,
# as is an unknown race key.
#
# Each [[raid]] is one raid:
#   key             The raid's key.
#   description     (optional) A text the game does not use.
#   type            "small" or "big".
#   interval        The mean time between two of its raids in seconds; or
#   date            the time of its one raid (seconds since 1970). Exactly
#                   one of the two.
#   script          (optional) "raids/<key>.lua", a script in the scripts
#                   folder with its hooks (onRaid, onWave).
#   [[raid.wave]]   One wave or more, in order:
#     delay         Seconds after the raid's start.
#     position      [x, y, z], where its monsters appear.
#     spread        How far from position, in fields along x and y.
#     race          The race's key (monsters.toml).
#     count         [<min>, <max>]: how many, 0 <= min <= max, max >= 1.
#     radius        (optional) How far the monsters walk; none: no limit.
#     lifetime      (optional) Seconds until they vanish; 0 or none: never.
#     message       (optional) A text broadcast when the wave comes.
#     location      (optional) A text the game does not use.
#     inventory     (optional) { type, maximum, chance } as for a race: the
#                   objects one of the wave's monsters gets.

