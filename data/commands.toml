# commands.toml: the commands of the game server, the spells of the classes al
# and om, which gamemasters give by saying their words (and players, those of
# their houses), written by patella-convert from the spell table the game had
# in its code and the rights its code checked. The game reads commands.toml in
# its data folder ([paths] data of config.toml), after spells.toml. This file
# says what a command is called, what is said to give it, which rights it
# needs and which script does what it does: a Lua file in the scripts folder
# (data/scripts/ in the repository). An unknown key or right, or a value of
# the wrong type, is an error.
#
# Command 103 (Reload Scripts) reloads the scripts and the data while the game
# runs; patella-convert adds it to the commands of the spell table.
#
# Each [[command]] is one command:
#   number  The command number, 1 to 255, each at most once and none of a
#           spell in spells.toml: the game keeps spells and commands in one
#           table by number. It does not say what the command does; script
#           does.
#   name    Its name, at most 30 characters.
#   words   What is said to give it, written as spells.toml writes words:
#           the class syllable and the next one as one word, every further
#           syllable a word of its own, separated by single spaces; at most
#           10 syllables, and no two commands or spells with the same. The
#           class is "al" for the commands of character rights, "om" for
#           those of account rights. "para" stands for a word the caster
#           chooses (a name, a number; in quotes if it has spaces).
#   right   The right a player needs for the command to do anything, by its
#           name below. Command 37 (Move) needs one of four rights, by the
#           word given, so its right is a table of them: vertical ("up" and
#           "down"), speed ("fast", "fastest", "slow" and "normal"),
#           coordinate (x,y,z or [x,y,z]) and mark (the name of a mark). The
#           code checks no right for the house commands and for those that
#           point to the rule violation dialog (Ctrl+Y): they have none.
#           Every other command needs it.
#   script  The script that does what the command does, "commands/<name>.lua"
#           in the scripts folder, whose global function onSay runs when it is
#           given. Left out, giving the command does nothing.
#
# The rights:
#   PREMIUM_ACCOUNT, NOTATION, NAMELOCK, STATEMENT_REPORT, BANISHMENT,
#   FINAL_WARNING, IP_BANISHMENT, KICK, HOME_TELEPORT, GAMEMASTER_BROADCAST,
#   ANONYMOUS_BROADCAST, NO_BANISHMENT, ALLOW_MULTICLIENT, LOG_COMMUNICATION,
#   READ_GAMEMASTER_CHANNEL, READ_TUTOR_CHANNEL, HIGHLIGHT_HELP_CHANNEL,
#   SEND_BUGREPORTS, NAME_INSULTING, NAME_SENTENCE, NAME_NONSENSICAL_LETTERS,
#   NAME_BADLY_FORMATTED, NAME_NO_PERSON, NAME_CELEBRITY, NAME_COUNTRY,
#   NAME_FAKE_IDENTITY, NAME_FAKE_POSITION, STATEMENT_INSULTING,
#   STATEMENT_SPAMMING, STATEMENT_ADVERT_OFFTOPIC, STATEMENT_ADVERT_MONEY,
#   STATEMENT_NON_ENGLISH, STATEMENT_CHANNEL_OFFTOPIC,
#   STATEMENT_VIOLATION_INCITING, CHEATING_BUG_ABUSE, CHEATING_GAME_WEAKNESS,
#   CHEATING_MACRO_USE, CHEATING_MODIFIED_CLIENT, CHEATING_HACKING,
#   CHEATING_MULTI_CLIENT, CHEATING_ACCOUNT_TRADING, CHEATING_ACCOUNT_SHARING,
#   GAMEMASTER_THREATENING, GAMEMASTER_PRETENDING, GAMEMASTER_INFLUENCE,
#   GAMEMASTER_FALSE_REPORTS, KILLING_EXCESSIVE_UNJUSTIFIED,
#   DESTRUCTIVE_BEHAVIOUR, SPOILING_AUCTION, INVALID_PAYMENT,
#   TELEPORT_TO_CHARACTER, TELEPORT_TO_MARK, TELEPORT_VERTICAL,
#   TELEPORT_TO_COORDINATE, LEVITATE, SPECIAL_MOVEUSE, MODIFY_GOSTRENGTH,
#   SHOW_COORDINATE, RETRIEVE, ENTER_HOUSES, OPEN_NAMEDOORS, INVULNERABLE,
#   UNLIMITED_MANA, KEEP_INVENTORY, ALL_SPELLS, UNLIMITED_CAPACITY,
#   ZERO_CAPACITY, ATTACK_EVERYWHERE, NO_ATTACK, NO_RUNES, NO_LOGOUT_BLOCK,
#   GAMEMASTER_OUTFIT, ILLUMINATE, CHANGE_PROFESSION, IGNORED_BY_MONSTERS,
#   SHOW_KEYHOLE_NUMBERS, CREATE_OBJECTS, CREATE_MONEY, CREATE_MONSTERS,
#   CHANGE_SKILLS, CLEANUP_FIELDS, NO_STATISTICS, RELOAD_SCRIPTS

