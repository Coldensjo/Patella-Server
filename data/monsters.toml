# monsters.toml: the monster races of the game server, converted from the
# original mon/*.mon files by patella-convert. The game reads monsters.toml in
# its data folder ([paths] data of config.toml) at start. A race is named by
# its key, the name of its original file without ".mon" ("demon",
# "illusion", "slime2"; the names players see are not unique): 1 to 30
# characters of a-z, 0-9 and '_'. Keys and race numbers are unique. An
# unknown key, a missing one, a value of the wrong type or out of range is an
# error.
#
# Each [[monster]] is one race, in the order of the race numbers:
#   key             The race's key.
#   number          Its race number, 1 to 511.
#   name            The name players see, 1 to 29 characters.
#   article         "a", "an" or "" (at most 2 characters).
#   outfit          { id = <outfit>, colors = [<head>, <body>, <legs>,
#                   <feet>] } (id 1 to 65535, colors 0 to 255) or { id = 0,
#                   object_type = <type> } (0 to 65535).
#   corpse          The object type of its corpse; female_corpse (optional)
#                   the female one, the same as corpse when missing.
#   blood           "blood", "slime", "bones", "fire" or "energy".
#   experience, summon_cost, flee_threshold, attack, defend, armor, poison,
#   lose_target     Numbers, as the original's keys.
#   strategy        [<nearest>, <weakest>, <most damage>, <random>], the
#                   chance of each in percent.
#   flags           (optional) Names of the race's flags: "kick_boxes",
#                   "kick_creatures", "see_invisible", "unpushable",
#                   "distance_fighting", "no_summon", "no_convince",
#                   "no_illusion", "no_burning", "no_poison", "no_energy",
#                   "no_hit", "no_life_drain", "no_paralyze".
#   skills          (optional) { skill = <name>, actual, minimum, maximum,
#                   next_level, factor_percent, add_level }, the skill named
#                   as the original's files name it ("hitpoints",
#                   "gostrength", ...).
#   talk            (optional) The texts it says; one starting with '#' is
#                   said loud, from its fourth character on.
#   inventory       (optional) { type, maximum, chance }: an object type, the
#                   most it carries of it, and the chance in 1/1000.
#   script          (optional) "monsters/<key>.lua", a script in the scripts
#                   folder with its hooks (onThink, onHealthChange, onTarget,
#                   onDeath).
#   [[monster.spell]] (optional, any number) One spell, in order, tried each
#                   time the monster thinks when Game.rand() % one_in == 0
#                   (one_in at least 1): shape, the shape's keys, impact, the
#                   impact's keys and one_in. The spell library
#                   (scripts/lib/monsters.lua) checks them:
#     shape "actor"        effect
#     shape "victim"       range, animation, effect
#     shape "origin"       radius, effect
#     shape "destination"  range, animation, radius, effect
#     shape "angle"        angle, range, effect
#     impact "damage"      damage_type, damage, variation
#     impact "field"       field_type
#     impact "healing"     amount, variation
#     impact "speed"       percent, variation, duration
#     impact "drunken"     strength, variation, duration
#     impact "strength"    skills, percent, variation, duration
#     impact "outfit"      outfit (as the race's), duration
#     impact "summon"      race (a race's key), maximum

