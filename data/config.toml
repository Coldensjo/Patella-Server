# config.toml: the settings of the game server, converted from the original
# .tibia by patella-convert. The game reads the file given with --config FILE,
# or else config.toml in its home folder ($HOME). A key left out keeps its
# default; an unknown key or a value of the wrong type is an error.

# How much the game prints to its console and log: messages of a level above
# this are left out (default 1).
debug_level = 2

# The beat: how often the game is advanced, in milliseconds (default 200).
beat = 50

# Key of the shared memory segment through which the operator tools watch
# the game (default 0).
shm_key = 10011

# The file of the server's RSA private key, for the clients' logins: PEM,
# PKCS#1 or PKCS#8, unencrypted, 1024 bits, exponent 65537 (rsakeygen makes
# one). A relative path is relative to the folder this file is in (default
# "key.pem"). Keep the file private.
rsa_key = "key.pem"

[world]
# The world's name; the game logs in to the query manager with it (default
# empty).
name = "Zanera"
# "public", or "private": the query manager then lets in only invited
# accounts (default "public").
state = "public"

# How long corpses and blood lie before they decay, as multipliers of the times
# in items.toml (total_expire_time): 2.0 makes them lie twice as long, 0.5 half
# as long. Each is 0.01 to 1000 (default 1.0, the original times), and counts
# for every stage of the decay. What already lies when the game starts keeps
# the time it had left.
[decay]
monster_corpse = 1.0  # the corpses of monsters
player_corpse = 1.0   # the corpses of players
blood = 1.0           # the splash of a hit, the pool of a death, a spilled liquid

# What players gain, as whole-number multipliers, each 1 to 1000 (default 1,
# the original rates): 5 makes a rat give 25 experience instead of 5.
[rates]
experience = 1   # the experience slain monsters give (not slain players)
magic_level = 1  # the mana spent that counts for the magic level
skill = 1        # the tries of the other skills: fighting, shielding, fishing

# How monster homes spawn, as multipliers, each 0.01 to 1000 (default 1.0, the
# times and amounts of monster_homes.toml). Read at the start.
[spawn]
speed = 1.0   # how fast a killed monster comes back: 4.0 four times as fast
amount = 1.0  # how many monsters a home holds: 2.0 twice as many

# A race's own speed and/or amount (by its key in monsters.toml, the .mon
# file's name), in place of the ones above; one left out stays as above.
[spawn.monsters]
# rat = { speed = 4.0 }
# dragon = { speed = 0.5, amount = 2.0 }

# How likely monsters carry each item of their loot, as a multiplier of its
# chance, 0.01 to 1000 (default 1.0, the chances of monsters.toml): 2.0 makes
# every item twice as likely, at most certain. Also the extra items of raids.
[loot]
chance = 1.0

# A race's own chance (by its key in monsters.toml), in place of the one above.
[loot.monsters]
# rat = { chance = 4.0 }

# What a player loses by dying. An amulet of loss and a red skull keep their
# rules.
[death]
penalty = 1.0          # times the loss of experience, magic level and skills
                       # (10%, 7% promoted, 1% less per blessing): 0.5 half,
                       # 0 none; 0 to 10, at most all
item_drop = 10         # the percent chance of each item worn to drop, 0 to 100
container_drop = true  # whether a worn container (the backpack) always drops;
                       # false: it takes the chance of item_drop too

# How much health and mana a fed player regains each time, as whole-number
# multipliers, 1 to 1000 (default 1: 1 hp and 4 mana every few rounds, by
# vocation; also in a bed while offline). The food lasts as long as ever.
[regeneration]
hp = 1
mana = 1

# Soul points, in seconds, each 1 to 86400. A kill that gives a player at least
# their level in experience makes them regain one soul point per interval for
# duration; a bed gives one per offline_interval of the time offline.
[soul]
interval = 120          # (the intervals at most duration)
promoted_interval = 15  # for a promoted player
duration = 240
offline_interval = 900

# Player killing.
[pvp]
fight_lock = 60      # seconds a fight keeps a player from logging out (after an
                     # attack on a player also out of protection zones), 1 to 86400
kill_lock = 900      # the same after killing a player, 1 to 86400
red_skull_days = 30  # how long a red skull lasts, 1 to 365
# Unjustified kills within a day, a week and 30 days (each 1 to 20) that give
# a red skull, and a banishment as well.
red_skull = { day = 3, week = 5, month = 10 }
banishment = { day = 6, week = 10, month = 20 }

# After how many minutes without an action a player is warned, and logged out
# a minute later (1 to 1440, default 15).
[idle]
minutes = 15

# How far monsters may be lured from their spawn (monster home). A monster
# farther than radius times its spawn's radius along x or y, or more than
# floors floors up or down, vanishes and respawns later. limit = false lets
# monsters follow anywhere. With values other than these defaults, a monster
# left outside its spawn's area wanders freely instead of standing still.
[lure]
limit = true  # false: no limit
radius = 1.0  # times each spawn's radius, 1 to 100
floors = 2    # 0 to 15

# What happens at a logout. to_temple = true: a player who logs out (quit,
# lost connection, idle, server shutdown) comes back in the temple of the home
# town. fight_block = false: a player may log out during or right after a
# fight or a kill, and a character whose connection is lost leaves at once
# (the fight still keeps the player out of protection zones).
[logout]
to_temple = false   # true: back in the temple at the next login
fight_block = true  # false: logout possible in a fight

# What a player gains per level, by vocation (a promoted one counts as its
# vocation): hp, mana and capacity, each 0 to 10000. Each value given counts
# from a character's next level on (and for a level lost); one not given stays
# what the character got when it chose its vocation. The original values:
[vocations]
# none = { hp = 5, mana = 5, capacity = 10 }
# knight = { hp = 15, mana = 5, capacity = 25 }
# paladin = { hp = 10, mana = 15, capacity = 20 }
# sorcerer = { hp = 5, mana = 30, capacity = 10 }
# druid = { hp = 5, mana = 30, capacity = 10 }

# Folders. A relative path is relative to the folder this file is in (default:
# empty for each).
[paths]
bin = "bin"          # reboot-daily, run when the game ends for a reboot
map = "map"          # the map sectors (*.sec) the game loads and saves
origmap = "origmap"  # the original map sectors
data = "dat"         # items.toml, map.toml and the other data
user = "usr"         # the old player files (NN/<id>.usr) querymanager-seed imports
log = "log"          # the log files
save = "save"        # game.pid, swapped-out sectors, patches, unsent player data

# The query managers, tried in this order (at most 10). password: the game's
# password at the query manager as the original .tibia writes it; the game
# disguises it before sending it, so it can have at most 8 characters.
[[query_manager]]
host = "127.0.0.1"
port = 7173
password = "nXE?/>j`"

[[query_manager]]
host = "127.0.0.1"
port = 7174
password = "nXE?/>j`"

[[query_manager]]
host = "127.0.0.1"
port = 7175
password = "nXE?/>j`"

[[query_manager]]
host = "127.0.0.1"
port = 7176
password = "nXE?/>j`"
