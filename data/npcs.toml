# npcs.toml: the NPCs of the game server, converted from the original npc/*.npc
# files by patella-convert. The game reads npcs.toml in its data folder ([paths]
# data of config.toml) at start and makes the NPCs in the order of the file.
# The order gives each NPC its creature ID and its turn among the creatures;
# it is the order in which the original game read its files on the reference
# installation (readdir of npc/). An unknown key, a missing one or a value of
# the wrong type is an error.
#
# Each [[npc]] is one NPC, and every key is needed:
#   name         Its name, 1 to 30 characters.
#   sex          "male" or "female".
#   race         Its race number, 1 to 511; the NPC gets the race's skills.
#   outfit       What it looks like: { id = <outfit>, colors = [<head>,
#                <body>, <legs>, <feet>] }, id 1 to 65535 and the colors 0 to
#                255; or { id = 0, object_type = <type> } (0 to 65535) to look
#                like an object.
#   home         [x, y, z], x and y 0 to 65535, z 0 to 15: where it is placed
#                at start, and the middle of the square it walks in.
#   radius       How far it walks from home, in fields along x and y, 0 to
#                65535, on home's floor.
#   go_strength  Its GoStrength skill (its speed), 0 to 65535, set as the
#                skill's value and maximum after the race's skills.
#   script       Its behaviour, "npcs/<name>.lua", a script in the scripts
#                folder (data/scripts/ in the repository) with the global
#                functions onCreatureSay(npc, creature, text, situation) and
#                onCreatureDisappear(npc, creature). The converted scripts hold
#                the NPC's rules, which lib/npc.lua matches and runs.

