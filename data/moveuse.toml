# moveuse.toml: the move and use rules of the game server, converted from the
# original moveuse.dat by patella-convert. The game reads moveuse.toml in its
# data folder ([paths] data of config.toml). An unknown key or name, a value
# of the wrong type or out of range, or an object type that does not exist,
# is an error.
#
# When something happens to an object, the game tries the rules of that event
# in the order of this file and runs the actions of the first rule whose
# conditions all hold; the order of the rules matters. Each [[rule]] is one
# rule:
#   section     The sections the rule is in, outermost first (BEGIN and END
#               of moveuse.dat), for the reader. Left out, none.
#   event       What sets it off, and what obj1 and obj2 are then:
#               use         The user uses obj1.
#               multi_use   The user uses obj1 on obj2.
#               movement    obj1 is moved.
#               collision   obj1 and obj2 come to lie on one field, obj1
#                           being the object with the collision_event flag.
#               separation  obj1 and obj2 come apart, obj1 being the object
#                           with the separation_event flag.
#   note        A note on the rule, for the reader. Left out, none.
#   conditions  What must hold, in this order: at least one
#               { name = "...", args = [...] }. negate = true inverts one
#               ("!" in moveuse.dat); ignore_result = true makes one hold
#               whatever it gives ("~"; it is still checked and can still
#               set temp).
#   actions     What is done, in this order: at least one
#               { name = "...", args = [...] }; args is left out when there
#               are none.
#
# The arguments, in the order the lists below give them:
#   object              "obj1", "obj2", "user" (the creature that uses
#                       an object; none for movement, collision and
#                       separation), "temp" (the object the rule's last
#                       is_object_there, is_creature_there, is_player_there,
#                       is_object_in_inventory, create_on_map, create,
#                       change_on_map or change_rel found or made) or "null"
#                       (none).
#   type                An object type number (items.toml); the comment after
#                       the entry gives its name.
#   flag                A flag of the object types, as items.toml names it.
#   type_attribute      An attribute of the object types, as items.toml names
#                       it.
#   instance_attribute  One of:
#                         content, chest_quest_number, amount, key_number,
#                         keyhole_number, level, door_quest_number,
#                         door_quest_value, charges, string, editor,
#                         container_liquid_type, pool_liquid_type,
#                         abs_teleport_destination, responsible,
#                         remaining_expire_time, saved_expire_time,
#                         remaining_uses
#   coordinate          A field [x, y, z]: x and y 24576 to 40959, z 0 to 15.
#   vector              An offset [x, y, z] from an object's field: x and y
#                       -8192 to 8191, z -8 to 7.
#   right               "premium_account" or "special_moveuse".
#   skill               One of:
#                         level, magic_level, hit_points, mana, go_strength,
#                         carry_strength, shielding, distance_fighting,
#                         sword_fighting, club_fighting, axe_fighting,
#                         fist_fighting, magic_defense, fishing, eating,
#                         shining, illusion, poison, burning, energy, drunken,
#                         mana_shield, soul_points
#   number              A 32-bit number.
#   text                A text.
#   comparison          "<", "<=", "=", ">=", ">" or "<>".
#
# The conditions:
#   is_position(object, coordinate), is_type(object, type), is_creature(object),
#   is_player(object), has_flag(object, flag),
#   has_type_attribute(object, type_attribute, comparison, number),
#   has_instance_attribute(object, instance_attribute, comparison, number),
#   has_text(object, text), is_peaceful(object), may_logout(object),
#   has_profession(object, number), has_level(object, comparison, number),
#   has_right(object, right),
#   has_quest_value(object, number, comparison, number),
#   test_skill(object, skill, number, number),
#   count_objects(object, comparison, number),
#   count_objects_on_map(coordinate, comparison, number),
#   is_object_there(coordinate, type), is_creature_there(coordinate),
#   is_player_there(coordinate), is_object_in_inventory(object, type, number),
#   is_protection_zone(object), is_house(object),
#   is_house_owner(object, object), is_dressed(object), random(number)
#
# The actions:
#   create_on_map(coordinate, type, number), create(object, type, number),
#   monster_on_map(coordinate, number), monster(object, number),
#   effect_on_map(coordinate, number), effect(object, number),
#   text_on_map(coordinate, text, number), text(object, text, number),
#   change_on_map(coordinate, type, type, number), change(object, type, number),
#   change_rel(object, vector, type, type, number),
#   set_attribute(object, instance_attribute, number),
#   change_attribute(object, instance_attribute, number),
#   set_quest_value(object, number, number),
#   damage(object, object, number, number), set_start(object, coordinate),
#   write_name(object, text, object), write_text(text, object), logout(object),
#   move_all_on_map(coordinate, coordinate), move_all(object, coordinate),
#   move_all_rel(object, vector), move_top_on_map(coordinate, type, coordinate),
#   move_top(object, coordinate), move_top_rel(object, vector),
#   move(object, coordinate), move_rel(object, object, vector),
#   retrieve(object, vector, vector), delete_all_on_map(coordinate),
#   delete_top_on_map(coordinate, type), delete_on_map(coordinate, type),
#   delete(object), delete_in_inventory(object, type, number),
#   description(object, object), load_depot(coordinate, type, object, number),
#   save_depot(coordinate, type, object, number), send_mail(object), nop()

[[rule]]
section = ["Use", "Beds"]
event = "use"
conditions = [
	{ name = "is_type", args = ["obj1", 2487] },  # 2487: a bed
	{ name = "is_house", args = ["obj1"] },
	{ name = "has_right", args = ["user", "premium_account"] },
	{ name = "may_logout", args = ["user"] },
]
actions = [
	{ name = "move_rel", args = ["user", "obj1", [0, 0, 0]] },
	{ name = "change", args = ["obj1", 2495, 0] },  # 2495: a bed
	{ name = "write_name", args = ["user", "%N", "obj1"] },
	{ name = "change_rel", args = ["obj1", [0, 1, 0], 2488, 2496, 0] },  # 2488: a bed; 2496: a bed
	{ name = "logout", args = ["user"] },
]

