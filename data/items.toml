# items.toml: the object types of the game server (items, grounds, walls,
# doors, corpses, magic fields, ...), converted from the original objects.srv
# by patella-convert. The game reads items.toml in its data folder ([paths]
# data of config.toml). An unknown key, flag or attribute, or a value of the
# wrong type, is an error.
#
# Each [[item]] is one type:
#   id           The type number, 0 to 65535, each at most once. 0 is the map
#                container, 1 to 10 are the body containers, 99 is the
#                creature.
#   name         The name the game shows. Left out, the type has none.
#   description  What the game adds when the object is looked at. Left out,
#                the type has none.
#   flags        What the type is and does, by the names below. Left out,
#                none.
#   attributes   The type's values by the names below, each a 32-bit number
#                (written signed). The game reads an attribute only while the
#                type has the flag it belongs to. One left out is 0. Those
#                listed at the end are given by name instead. meaning makes
#                the type the special object of that name (each for at most
#                one type), which the game asks for by it (money, depot
#                chests, blood, magic fields, ...).
#
# The flags:
#   bank, clip, bottom, top, container, chest, cumulative, use_event,
#   change_use, force_use, multi_use, dist_use, movement_event, collision_event,
#   separation_event, key, key_door, name_door, level_door, quest_door, bed,
#   food, rune, information, text, write, write_once, liquid_container,
#   liquid_source, liquid_pool, teleport_absolute, teleport_relative, unpass,
#   unmove, unthrow, unlay, avoid, magic_field, restrict_level,
#   restrict_profession, take, hang, hook_south, hook_east, rotate, destroy,
#   clothes, skill_boost, protection, light, rope_spot, corpse, expire,
#   expire_stop, wear_out, weapon, shield, bow, throw, wand, ammo, armor,
#   height, disguise, show_detail, special
#
# The attributes, each with the flag it belongs to:
#   waypoints (bank), capacity (container), change_target (change_use),
#   key_door_target (key_door), name_door_target (name_door),
#   level_door_target (level_door), quest_door_target (quest_door),
#   nutrition (food), information_type (information), font_size (text),
#   max_length (write), max_length_once (write_once),
#   source_liquid_type (liquid_source), abs_teleport_effect (teleport_absolute),
#   rel_teleport_displacement (teleport_relative),
#   rel_teleport_effect (teleport_relative), avoid_damage_types (avoid),
#   minimum_level (restrict_level), professions (restrict_profession),
#   weight (take), rotate_target (rotate), destroy_target (destroy),
#   body_position (clothes), skill_number (skill_boost),
#   skill_modification (skill_boost), protection_damage_types (protection),
#   damage_reduction (protection), brightness (light), light_color (light),
#   corpse_type (corpse), total_expire_time (expire), expire_target (expire),
#   total_uses (wear_out), wear_out_target (wear_out), weapon_type (weapon),
#   weapon_attack_value (weapon), weapon_defend_value (weapon),
#   shield_defend_value (shield), bow_range (bow), bow_ammo_type (bow),
#   throw_range (throw), throw_attack_value (throw), throw_defend_value (throw),
#   throw_missile (throw), throw_special_effect (throw),
#   throw_effect_strength (throw), throw_fragility (throw), wand_range (wand),
#   wand_mana_consumption (wand), wand_attack_strength (wand),
#   wand_attack_variation (wand), wand_damage_type (wand), wand_missile (wand),
#   ammo_type (ammo), ammo_attack_value (ammo), ammo_missile (ammo),
#   ammo_special_effect (ammo), ammo_effect_strength (ammo),
#   armor_value (armor), elevation (height), disguise_target (disguise),
#   meaning (bank)
#
# The attributes given by name, each with its names. One whose names are
# in [] is an array of them, each a bit of the value ([] for none).
#   information_type: date, time, blessings, spellbook
#   source_liquid_type: none, water, wine, beer, mud, blood, slime, oil,
#     urine, milk, mana_fluid, life_fluid, lemonade
#   abs_teleport_effect: none, blood_hit, mana_hit, poff, block_hit,
#     explosion_area, explosion, fire_area, poison, hit_area, teleport,
#     energy_hit, magic_blue, magic_red, magic_green, fire_hit, poison_hit,
#     death
#   rel_teleport_effect: none, blood_hit, mana_hit, poff, block_hit,
#     explosion_area, explosion, fire_area, poison, hit_area, teleport,
#     energy_hit, magic_blue, magic_red, magic_green, fire_hit, poison_hit,
#     death
#   avoid_damage_types: [physical, poison, fire, energy, unused,
#     poison_condition, fire_condition, energy_condition, life_drain,
#     mana_drain]
#   professions: [none, knight, paladin, sorcerer, druid]
#   body_position: both_hands, head, neck, container, torso, right_hand,
#     left_hand, legs, feet, finger, ammo
#   skill_number: level, magic_level, hit_points, mana, go_strength,
#     carry_strength, shielding, distance_fighting, sword_fighting,
#     club_fighting, axe_fighting, fist_fighting, magic_defense, fishing,
#     eating, shining, illusion, poison, burning, energy, drunken, mana_shield,
#     soul_points
#   protection_damage_types: [physical, poison, fire, energy, unused,
#     poison_condition, fire_condition, energy_condition, life_drain,
#     mana_drain]
#   corpse_type: player, monster
#   weapon_type: sword, club, axe
#   bow_ammo_type: bolt, arrow
#   throw_missile: none, spear, bolt, arrow, fire, energy, poison_arrow,
#     burst_arrow, throwing_star, throwing_knife, small_stone, death,
#     large_rock, snowball, power_bolt, poison
#   throw_special_effect: none, poison, burst
#   wand_damage_type: physical, poison, fire, energy, unused,
#     poison_condition, fire_condition, energy_condition, life_drain, mana_drain
#   wand_missile: none, spear, bolt, arrow, fire, energy, poison_arrow,
#     burst_arrow, throwing_star, throwing_knife, small_stone, death,
#     large_rock, snowball, power_bolt, poison
#   ammo_type: bolt, arrow
#   ammo_missile: none, spear, bolt, arrow, fire, energy, poison_arrow,
#     burst_arrow, throwing_star, throwing_knife, small_stone, death,
#     large_rock, snowball, power_bolt, poison
#   ammo_special_effect: none, poison, burst
#   meaning: money_one, money_hundred, money_ten_thousand,
#     inventory_right_hand, inventory_left_hand, inventory_body_male,
#     inventory_body_female, inventory_container, inventory_food, depot_locker,
#     depot_chest, parcel_new, parcel_stamped, parcel_label, letter_new,
#     letter_stamped, blood_splash, blood_pool, rune_blank,
#     magic_field_fire_dangerous, magic_field_fire_harmless,
#     magic_field_poison_dangerous, magic_field_poison_harmless,
#     magic_field_energy_dangerous, magic_field_energy_harmless, magic_wall,
#     rushwood

